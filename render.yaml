databases:
  - name: secure-login-v2-db
    databaseName: secure_login_v2
    plan: free

services:
  - type: web
    name: secure-login-system-v2
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: secure-login-v2-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: PASSWORD_PEPPER_VERSION
        value: "1"
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: RECOVERY_CODE_PEPPER
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: TOTP_ISSUER
        value: "Secure Login System V2"
      - key: RATELIMIT_STORAGE_URI
        value: "memory://"
    autoDeploy: false
